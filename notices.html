<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>공지사항 | 대한민국 주요 뉴스 브리핑</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Phosphor Icons CDN -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: [
                                "Pretendard",
                                "-apple-system",
                                "BlinkMacSystemFont",
                                "system-ui",
                                "Roboto",
                                "sans-serif",
                            ],
                        },
                    },
                },
            };
        </script>
        <style>
            .custom-scroll::-webkit-scrollbar {
                width: 5px;
            }
            .custom-scroll::-webkit-scrollbar-track {
                background: transparent;
            }
            .custom-scroll::-webkit-scrollbar-thumb {
                background: rgba(148, 163, 184, 0.25);
                border-radius: 9999px;
            }
            .custom-scroll::-webkit-scrollbar-thumb:hover {
                background: rgba(148, 163, 184, 0.45);
            }
        </style>
    </head>
    <body
        class="bg-slate-950 text-slate-100 min-h-screen antialiased font-sans flex flex-col justify-between selection:bg-sky-500/30 selection:text-sky-200"
    >
        <!-- Top Navigation Header -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-sm backdrop-blur-md bg-slate-900/90">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <a
                        href="index.html"
                        id="backLink"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/80 hover:border-slate-600 transition duration-150"
                        title="메인 뉴스 브리핑으로 돌아가기"
                    >
                        ← 뉴스 브리핑
                    </a>
                    <span class="text-slate-600">|</span>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        <i class="ph-bold ph-megaphone text-sky-400"></i>
                        공지사항
                    </h1>
                </div>

                <div class="flex items-center gap-2">
                    <button
                        type="button"
                        id="refreshBtn"
                        onclick="loadNotices()"
                        class="w-9 h-9 inline-flex items-center justify-center text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 hover:border-slate-600 rounded-xl transition duration-150 cursor-pointer shadow-sm"
                        title="공지사항 새로고침"
                        aria-label="공지사항 새로고침"
                    >
                        <i id="refreshIcon" class="ph-bold ph-arrows-clockwise text-base"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
            <!-- Header Intro Card -->
            <section class="mb-8 p-5 sm:p-6 rounded-2xl bg-gradient-to-r from-sky-950/40 via-slate-900 to-slate-900 border border-sky-900/30 shadow-sm">
                <div class="flex items-start gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center shrink-0 mt-0.5">
                        <i class="ph-bold ph-bell-ringing text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-semibold text-white">공지사항 & 업데이트 소식</h2>
                        <p class="text-xs sm:text-sm text-slate-400 mt-1">
                            대한민국 주요 뉴스 브리핑의 새로운 기능, 서비스 업데이트 및 점검 일정을 안내해 드립니다.
                        </p>
                    </div>
                </div>
            </section>

            <!-- Announcements List Container -->
            <section id="noticesSection" aria-label="공지사항 목록">
                <div id="noticesContainer" class="space-y-4">
                    <!-- Loading Skeleton / Placeholder -->
                    <div id="loadingState" class="p-12 text-center bg-slate-900 border border-slate-800 rounded-2xl text-slate-400 shadow-sm">
                        <i class="ph-bold ph-spinner animate-spin text-2xl text-sky-400 inline-block mb-3"></i>
                        <p class="text-sm font-medium">공지사항을 불러오는 중입니다...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="mt-16 border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
            <p>대한민국 주요 뉴스 브리핑 공지사항 센터</p>
            <p class="mt-1 text-slate-600">안정적인 서비스 운영과 정확한 뉴스 전달을 위해 노력하고 있습니다.</p>
        </footer>

        <!-- Client-side Logic Script -->
        <script>
            // Category badges mapping
            const CATEGORY_MAP = {
                update: {
                    label: "업데이트",
                    className: "bg-sky-500/10 text-sky-400 border-sky-500/20",
                    icon: "ph-sparkle",
                },
                notice: {
                    label: "공지",
                    className: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                    icon: "ph-info",
                },
                maintenance: {
                    label: "점검",
                    className: "bg-amber-500/10 text-amber-400 border-amber-500/20",
                    icon: "ph-wrench",
                },
            };

            // Read notice IDs helper using localStorage
            function getReadNoticeIds() {
                try {
                    const raw = localStorage.getItem("read_notice_ids");
                    if (!raw) return [];
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed.map(String) : [];
                } catch (e) {
                    console.warn("Failed to parse read_notice_ids from localStorage:", e);
                    return [];
                }
            }

            // Update read notice IDs in localStorage
            function markNoticesAsRead(noticeIds) {
                if (!Array.isArray(noticeIds) || noticeIds.length === 0) return;
                try {
                    const readIds = getReadNoticeIds();
                    const readSet = new Set(readIds);
                    noticeIds.forEach((id) => {
                        if (id !== undefined && id !== null) {
                            readSet.add(String(id));
                        }
                    });
                    localStorage.setItem("read_notice_ids", JSON.stringify(Array.from(readSet)));
                } catch (e) {
                    console.error("Failed to save read_notice_ids to localStorage:", e);
                }
            }

            // Check if notice is within the last 7 days relative to now
            function isWithinLast7Days(dateString) {
                if (!dateString) return false;
                const noticeDate = new Date(dateString);
                if (isNaN(noticeDate.getTime())) return false;
                const now = new Date();
                const diffMs = now.getTime() - noticeDate.getTime();
                const diffDays = diffMs / (1000 * 60 * 60 * 24);
                // Return true if within 7 days and not in future
                return diffDays >= 0 && diffDays <= 7;
            }

            // Render a single notice card
            function renderNoticeCard(notice, wasUnread) {
                const categoryInfo = CATEGORY_MAP[notice.category] || {
                    label: notice.category || "안내",
                    className: "bg-slate-700/40 text-slate-300 border-slate-600/40",
                    icon: "ph-tag",
                };

                const article = document.createElement("article");
                article.className =
                    "notice-card bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm hover:border-slate-700 transition duration-150";
                article.dataset.noticeId = String(notice.id);

                article.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold border ${categoryInfo.className}">
                                <i class="ph-bold ${categoryInfo.icon} text-xs"></i>
                                ${escapeHtml(categoryInfo.label)}
                            </span>
                            ${
                                wasUnread
                                    ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-500 text-white tracking-wide uppercase">NEW</span>`
                                    : ""
                            }
                        </div>
                        <span class="inline-flex items-center gap-1 text-xs text-slate-400 font-medium">
                            <i class="ph-regular ph-calendar-blank"></i>
                            <time datetime="${escapeHtml(notice.date)}">${escapeHtml(notice.date)}</time>
                        </span>
                    </div>
                    <h3 class="text-base sm:text-lg font-bold text-white tracking-tight leading-snug">
                        ${escapeHtml(notice.title)}
                    </h3>
                    <p class="mt-2.5 text-xs sm:text-sm text-slate-300 leading-relaxed whitespace-pre-line">
                        ${escapeHtml(notice.content)}
                    </p>
                `;

                return article;
            }

            // HTML escape helper
            function escapeHtml(str) {
                if (!str) return "";
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // Fetch and render notices
            async function loadNotices() {
                const container = document.getElementById("noticesContainer");
                const icon = document.getElementById("refreshIcon");
                const btn = document.getElementById("refreshBtn");

                if (icon) icon.classList.add("animate-spin");
                if (btn) btn.disabled = true;

                try {
                    const response = await fetch("data/notices.json?t=" + Date.now());
                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}`);
                    }
                    const data = await response.json();

                    if (!Array.isArray(data)) {
                        throw new Error("Invalid format: expected array of notices");
                    }

                    if (data.length === 0) {
                        container.innerHTML = `
                            <div class="p-12 text-center bg-slate-900 border border-slate-800 rounded-2xl text-slate-400 shadow-sm">
                                <i class="ph-regular ph-newspaper-clipping text-3xl text-slate-500 inline-block mb-2"></i>
                                <p class="text-sm">등록된 공지사항이 없습니다.</p>
                            </div>
                        `;
                        return;
                    }

                    // Sort newest first by date string descending
                    const sortedNotices = [...data].sort((a, b) => {
                        const dateA = new Date(a.date).getTime() || 0;
                        const dateB = new Date(b.date).getTime() || 0;
                        return dateB - dateA;
                    });

                    // Snapshot existing read IDs before marking newly read
                    const existingReadIds = new Set(getReadNoticeIds());

                    container.innerHTML = "";
                    const displayedIds = [];

                    sortedNotices.forEach((notice) => {
                        displayedIds.push(notice.id);
                        const isUnread =
                            !existingReadIds.has(String(notice.id)) &&
                            isWithinLast7Days(notice.date);
                        const card = renderNoticeCard(notice, isUnread);
                        container.appendChild(card);
                    });

                    // Mark all displayed notices as read in localStorage
                    markNoticesAsRead(displayedIds);
                } catch (err) {
                    console.error("Failed to load notices:", err);
                    container.innerHTML = `
                        <div class="p-8 text-center bg-slate-900 border border-rose-900/30 rounded-2xl text-rose-400 shadow-sm">
                            <i class="ph-bold ph-warning-circle text-3xl inline-block mb-2 text-rose-400"></i>
                            <p class="text-sm font-semibold">공지사항을 불러오는 중 오류가 발생했습니다.</p>
                            <p class="text-xs text-slate-400 mt-1">잠시 후 다시 시도해 주세요.</p>
                            <button
                                type="button"
                                onclick="loadNotices()"
                                class="mt-4 px-4 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                            >
                                다시 시도
                            </button>
                        </div>
                    `;
                } finally {
                    if (icon) icon.classList.remove("animate-spin");
                    if (btn) btn.disabled = false;
                }
            }

            // Auto-load on page load
            window.addEventListener("DOMContentLoaded", loadNotices);
        </script>
    </body>
</html>
